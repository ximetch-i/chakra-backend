server:
  port: 8080

spring:
  application:
    name: chakra

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chakra_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# Propiedades propias de Chakra
chakra:
  weather:
    open-meteo:
      base-url: https://api.open-meteo.com/v1/forecast
      forecast-days: 14
    nasa-power:
      base-url: https://power.larc.nasa.gov/api/temporal/climatology/point
      community: AG
      parameters: T2M,PRECTOTCORR,RH2M
  external-api:
    timeout-ms: 5000

logging:
  level:
    com.agrialert: DEBUG
